<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" fill="none">
  <!-- Paper plane icon -->
  <g transform="translate(8, 8)">
    <!-- Main body triangle pointing upper-right -->
    <polygon points="6,76 76,6 58,76" fill="white" stroke="#0f172a" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- Lower fold / underside -->
    <polygon points="6,76 76,6 30,88" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- Inner crease line -->
    <line x1="6" y1="76" x2="44" y2="48" stroke="#0f172a" stroke-width="1.8"/>
  </g>

  <!-- FLYER DISTRIBUTION -->
  <text
    x="106"
    y="46"
    font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif"
    font-weight="900"
    font-size="21"
    fill="#1d4ed8"
    letter-spacing="0.8">FLYER DISTRIBUTION</text>

  <!-- HAMPSHIRE -->
  <text
    x="106"
    y="70"
    font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif"
    font-weight="800"
    font-size="14.5"
    fill="#0f172a"
    letter-spacing="2.5">HAMPSHIRE</text>

  <!-- Location pin icon -->
  <g transform="translate(222, 56)">
    <path d="M6.5,0 C2.91,0 0,2.91 0,6.5 C0,11.38 6.5,18.5 6.5,18.5 C6.5,18.5 13,11.38 13,6.5 C13,2.91 10.09,0 6.5,0 Z" fill="#0f172a"/>
    <circle cx="6.5" cy="6.5" r="2.4" fill="white"/>
  </g>
</svg>
